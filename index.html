<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de Tyrie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: bannière nuit de Tyrie + 4 onglets (carnet commun, Nymos, Elodie, catalogue). Bleu = Nymos, jaune doux = Jeff. Fiche succès en panneau sombre façon jeu */
/* Thème unique sombre, calqué sur gw2.app : fond ardoise, cartes gris-bleu, accents rose et violet */
:root{
  --bg:#1c212b; --surface:#29303c; --sunk:#222833; --ink:#f2f2f2; --muted:#a3a3ad; --line:#414458;
  --night:#0e1116; --night-2:#3b2470; --gold:#f5c35b; --on-night:#f2f2f2;
  --pa:#5ab4ff; --pa-soft:#1b3348; --pb:#e3bd5c; --pb-soft:#3b3220;
  --accent:#b48af8; --accent-soft:#2f2747;
  --c0:#b48af8; --c0s:#2f2747; --c1:#b48af8; --c1s:#2f2747; --c2:#3fc8b4; --c2s:#10302b; --c3:#f27468; --c3s:#3a1a18; --c4:#7cc95a; --c4s:#1a2e14;
  --ok:#4ade80; --ok-soft:#173326; --danger:#f87171; --scrim:#05070cc0;
  --g-bg:#252c38; --g-panel:#1f252f; --g-line:#414458; --g-ink:#f2f2f2; --g-muted:#a3a3ad; --g-ok:#4ade80; --g-ok-bg:#1d3a2e; --g-ok-ink:#c4f5d6; --g-row:#2e3644;
  --f-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-logo:"VT323",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;background-color:var(--bg);
  background-image:radial-gradient(60rem 28rem at 15% -6rem, #ff7ac62e, transparent 70%),radial-gradient(60rem 30rem at 85% -8rem, #b48af833, transparent 70%),
  radial-gradient(40rem 30rem at 50% 110%, #3b247055, transparent 70%),linear-gradient(180deg,#14171f 0,var(--bg) 26rem);background-attachment:fixed}
#app{max-width:52rem;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
.side{background:#1b2029e6;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
@media (min-width:1360px){ .side{position:fixed;top:20px;left:calc(50% + 26rem + 16px);width:280px;max-height:calc(100vh - 40px);overflow-y:auto;z-index:4} }
.side-h{display:flex;justify-content:space-between;align-items:center}
.goofy{display:none;position:fixed;pointer-events:none;left:max(16px, calc(25vw - 13rem - var(--gw,120px)/2));bottom:18px;z-index:3;width:var(--gw,120px);transition:width .8s cubic-bezier(.2,1.4,.4,1)}
@media (min-width:1180px){ .goofy{display:block} }
.goofy-img{width:100%;height:auto;display:block;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite;filter:drop-shadow(0 10px 14px #0009)}
.goofy.grow .goofy-img{animation:grow .9s cubic-bezier(.2,1.6,.4,1), sway 4.5s ease-in-out .9s infinite}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes grow{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.goofy-say{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,6px);width:max-content;max-width:240px;background:#1b2029f2;border:1px solid var(--line);color:#f2f2f2;font-size:.82rem;font-weight:600;line-height:1.35;padding:8px 12px;border-radius:12px;box-shadow:0 8px 24px #0008;text-align:center;opacity:0;transition:opacity .6s ease,transform .6s ease}
.goofy-say.on{opacity:1;transform:translate(-50%,0)}
.goofy-say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:#1b2029f2}
.goofy-ctl{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;opacity:.35;transition:opacity .2s}
.goofy:hover .goofy-ctl,.goofy-ctl:focus-within{opacity:1}
.goofy-ctl button{border:1px solid var(--line);background:#1b2029e6;color:var(--ink);width:24px;height:24px;border-radius:50%;font-weight:800;line-height:1;padding:0}
.goofy-ctl[hidden]{display:none}
.private-ico{font-size:2.4rem;margin-bottom:4px}
.goofy-ctl button:hover:not(:disabled){border-color:var(--muted)}
.goofy-ctl button:disabled{opacity:.3;cursor:default}
.goofy-lbl{font-size:.7rem;color:var(--muted);min-width:70px;text-align:center}
@media (prefers-reduced-motion:reduce){ .goofy-img,.goofy.grow .goofy-img{animation:none} .goofy-say{transition:none} }
.side-hr{display:flex;align-items:center;gap:6px}
.side-x{border:0;background:transparent;color:var(--muted);width:24px;height:24px;border-radius:6px;font-size:.85rem}
.side-x:hover{background:var(--surface);color:var(--ink)}
.side-open{align-self:flex-end;border:1px solid var(--line);background:#1b2029e6;color:var(--muted);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.side-open:hover{color:var(--ink);border-color:var(--muted)}
@media (min-width:1360px){ .side-open{position:fixed;top:20px;left:calc(50% + 26rem + 16px);z-index:4} }
.side-h .count{font-size:.72rem;background:var(--surface);border-radius:999px;padding:0 8px;color:var(--muted)}
.side-tabs{display:flex;gap:6px}
.side-tabs button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.8rem}
.side-tabs button .avatar{width:18px;height:18px;font-size:.6rem}
.side-tabs button[aria-pressed="true"]{color:#fff;border-color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,transparent)}
.chars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
@media (max-width:1359px){ .chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))} }
.char{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;background:var(--surface);border:1px solid transparent;text-decoration:none;color:inherit;border-left:3px solid var(--prof)}
a.char:hover{border-color:var(--line);border-left-color:var(--prof);background:#323a48}
.char-ic{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border-radius:6px;background:#0005;color:var(--prof);font-weight:800}
.char-ic img{width:26px;height:26px}
.char-t{display:flex;flex-direction:column;min-width:0;flex:1}
.char-n{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.char-m{font-size:.72rem;color:var(--muted)}
.char-go{color:var(--muted);font-size:.8rem}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer} button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--pb);outline-offset:2px}
a{color:inherit}
.c0{--sc:var(--c0);--scs:var(--c0s)} .c1{--sc:var(--c1);--scs:var(--c1s)} .c2{--sc:var(--c2);--scs:var(--c2s)} .c3{--sc:var(--c3);--scs:var(--c3s)} .c4{--sc:var(--c4);--scs:var(--c4s)}
.pa{--pc:var(--pa);--pcs:var(--pa-soft)} .pb{--pc:var(--pb);--pcs:var(--pb-soft)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;white-space:nowrap}
.bar{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s}
.hint{font-size:.88rem;color:var(--muted)}
mark{background:var(--gold);color:#1a1f2e;border-radius:2px;padding:0 1px}

/* bannière */
.banner{border-radius:12px;padding:18px 20px 16px;color:var(--on-night);border:1px solid var(--line);background:
  radial-gradient(90% 160% at 0% 0%, #5b1f4f 0%, transparent 55%),
  radial-gradient(90% 160% at 100% 0%, var(--night-2) 0%, transparent 60%), var(--night);
  display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.banner::after{display:none;content:"";position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 85% 60%,#fff5 50%,transparent 51%),radial-gradient(1.4px 1.4px at 40% 75%,#fff4 50%,transparent 51%);pointer-events:none}
.banner>*{position:relative;z-index:1}
.b-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.banner .eyebrow{color:#c9c3e8}
.banner h1{font-family:var(--f-logo);font-weight:400;font-size:2.6rem;line-height:1;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,#ff7ac6,#b48af8);-webkit-background-clip:text;background-clip:text;color:transparent}
.status{font-size:.78rem;display:flex;align-items:center;gap:6px;background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;color:#e3def5;max-width:100%}
.dot{width:8px;height:8px;border-radius:50%;background:#9a93c0;flex-shrink:0}
.status[data-s="ok"] .dot{background:#5cd18e} .status[data-s="saving"] .dot{background:var(--gold)} .status[data-s="view"] .dot,.status[data-s="ro"] .dot,.status[data-s="err"] .dot{background:#ff8a7a}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.summary{grid-template-columns:1fr}}
.pres{white-space:nowrap;display:inline-flex;align-self:flex-start;align-items:center;gap:5px;margin:2px 0;font-size:.7rem;font-weight:700;color:#9aa4ba;vertical-align:middle;background:#ffffff0d;border-radius:999px;padding:1px 8px}
.pres i{width:7px;height:7px;border-radius:50%;background:#6b7280}
.pres.on{color:#86efac;background:#16a34a22}
.pres.on i{background:#22c55e;box-shadow:0 0 0 3px #22c55e33;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #22c55e00}}
@media (prefers-reduced-motion:reduce){.pres.on i{animation:none}}
.pl.gains{--pc:var(--gold);background:linear-gradient(135deg,#f5c35b1c,#ffffff06 60%);grid-column:1/-1;display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:8px 24px}
.gains .gains-rows{flex-direction:row;flex-wrap:wrap;gap:8px 20px;justify-content:flex-end}
@media (max-width:640px){.pl.gains{grid-template-columns:1fr}.gains .gains-rows{justify-content:flex-start}}
.gains-h{display:flex;flex-direction:column;gap:2px}
.gains-h .eyebrow{color:#f5d27a}
.gains-tot{display:flex;align-items:center;gap:8px}
.gains-tot img{width:30px;height:30px}
.gains-tot b{font-size:1.7rem;color:#f5d27a;font-variant-numeric:tabular-nums;line-height:1}
.gains-tot span{font-size:.8rem;color:#cfc9ea}
.gains-rows{display:flex;flex-direction:column;gap:6px}
.gain-row{display:flex;align-items:center;gap:8px;font-size:.85rem}
.gain-row .avatar{width:22px;height:22px;font-size:.65rem}
.gain-row .g-nm{flex:1;color:#e9ecf3;font-weight:600}
.g-val{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:#f5d27a;font-variant-numeric:tabular-nums}
.g-val img{width:16px;height:16px}
.g-val small{color:#b9b9c6;font-weight:600}
.pl{background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 16%,transparent),#ffffff06 60%);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pl-id{display:flex;align-items:center;gap:12px;min-width:0}
.pl-pic{position:relative;border:0;padding:0;background:transparent;border-radius:50%;flex-shrink:0}
.pl-pic .avatar{width:58px;height:58px;font-size:1.5rem;box-shadow:0 0 0 3px var(--pc),0 6px 18px #0008}
.pl-pic .edit{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--night);border:1px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:#fff;opacity:.85}
.pl-pic:hover .edit{opacity:1;background:var(--surface)}
.pl-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.pl-txt .pl-nm{font-weight:800;font-size:1.15rem;color:#fff;line-height:1.2;background:none;border:0;display:block}
.pl-txt .acc{font-size:.78rem;color:#b9b9c6;overflow-wrap:anywhere}
.ap{display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:4px 10px 4px 6px;border-radius:999px;background:#00000040;border:1px solid #f5c35b55;font-weight:800;font-size:1.05rem;color:#f5d27a;font-variant-numeric:tabular-nums;white-space:nowrap}
.ap img{width:24px;height:24px;display:block}
.pl-prog{display:flex;align-items:center;gap:8px}
.pl-prog .bar{flex:1}
.pl-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl-name{font-weight:700;border:0;background:transparent;padding:0;min-width:0;text-align:left;color:#fff;display:flex;align-items:center;gap:8px}
.pl-name:not(:disabled):hover{text-decoration:underline dotted}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff;flex-shrink:0;background:var(--pc);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pl .num{color:#d9d4ef}
.pl .bar{background:#ffffff1c}
.pl input{background:#ffffff1a;border:1px solid #ffffff40;color:#fff;border-radius:6px;padding:3px 7px;width:9rem}
.pl-sync{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:#cfc9ea}
.sync-btn{border:1px solid #ffffff40;background:#ffffff14;color:#fff;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;flex-shrink:0}
.sync-btn:hover{background:#ffffff26}

/* onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--night);border-radius:10px 10px 0 0;padding:0 6px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;padding:11px 12px;font-family:var(--f-display);font-weight:600;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc,var(--pb))}
.tab .avatar{width:20px;height:20px;font-size:.66rem;font-family:var(--f-body)}
.tab .count{font-family:var(--f-body);font-size:.7rem;background:var(--surface);border-radius:999px;padding:0 7px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.search svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:1rem;padding:4px 0;outline:none}
.selects{display:flex;flex-wrap:wrap;gap:8px}
.selects select{flex:1 1 12rem;min-width:0}

/* étapes du carnet */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage-head{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--scs);border-bottom:1px solid var(--line)}
.medal{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:#fff;background:var(--sc);border-radius:50%;box-shadow:inset 0 0 0 3px #ffffff40}
.stage-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.stage .eyebrow{color:var(--sc)}
.stage-title{background:transparent;border:0;padding:0;text-align:left;font-family:var(--f-display);font-weight:700;font-size:1.15rem;width:100%;overflow-wrap:anywhere}
.stage-title:not(:disabled):hover{text-decoration:underline dotted}
.stage-meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mini{display:flex;align-items:center;gap:6px}
.mini .bar{width:64px;background:var(--surface)}
.icons{display:flex;gap:2px;flex-shrink:0}
.ib{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:4px 7px;font-size:.85rem;font-weight:600}
.ib:not(:disabled):hover{background:var(--sunk);color:var(--ink)}
.ib:disabled{opacity:.35}
.ib.danger[data-arm="1"]{background:var(--danger);color:#fff}
ul.items{list-style:none;margin:0;padding:0}
li.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
li.item:last-child{border-bottom:0}
.icon{width:44px;height:44px;flex-shrink:0;position:relative;border-radius:9px;overflow:hidden}
.icon img,.icon svg{width:100%;height:100%;display:block}
.icon b{position:absolute;right:0;bottom:0;font-size:.62rem;font-weight:800;color:#fff;background:#000a;border-radius:6px 0 0 0;padding:0 4px;line-height:1.4}
li.item.done .icon{filter:saturate(.25);opacity:.7}
li.item.done .txt{color:var(--muted);text-decoration:line-through}
.body{min-width:0;display:flex;flex-direction:column;gap:5px}
.txt{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
button.txt{border:0;background:transparent;padding:0;text-align:left}
button.txt:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.tag.ach{background:var(--scs,var(--sunk));color:var(--sc,var(--muted))}
.tag.solo-a{background:var(--pa-soft);color:var(--pa)} .tag.solo-b{background:var(--pb-soft);color:var(--pb)}
a.lnk{font-size:.8rem;font-weight:600;color:var(--sc,var(--pa));text-decoration:none;border-bottom:1px solid currentColor}
.desc{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.note{font-size:.88rem;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:6px;padding:5px 8px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.ck{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:2px 9px 2px 4px;font-size:.78rem;font-weight:700;background:var(--surface);min-height:26px;color:var(--muted)}
.ck .box{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--pc);display:grid;place-items:center;font-size:10px;line-height:1}
.ck[aria-pressed="true"]{background:var(--pcs);border-color:var(--pc);color:var(--pc)}
.ck[aria-pressed="true"] .box{background:var(--pc)}
.ck[aria-pressed="true"] .box::after{content:"✓";color:#fff}
.ck .api{font-size:.62rem;letter-spacing:.06em;opacity:.8}
.ck.sm{min-height:22px;padding:1px 4px;font-size:.7rem}
.ck.sm .box{width:13px;height:13px;font-size:8px}
.prog{display:flex;flex-wrap:wrap;gap:10px}
.prog .mini .bar{width:80px}
.steps-toggle{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;font-size:.82rem;font-weight:600;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
ol.steps li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);align-items:center;font-size:.9rem}
ol.steps li:last-child{border-bottom:0}
ol.steps li .sck{display:flex;gap:4px}
ol.steps li.all{color:var(--muted)}
.kind{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.7;margin-right:6px}

/* formulaires */
.edit-form,.add-form{display:grid;gap:8px;padding:12px 14px;background:var(--sunk)}
.edit-form{grid-column:1/-1;border-radius:8px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>*{flex:1 1 10rem;min-width:0}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=url],input[type=password],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:.95rem;width:100%;box-sizing:border-box}
.search input[type=search]{border:0;padding:4px 0;background:transparent}
textarea{min-height:3.5rem;resize:vertical}
.btn{border:1px solid var(--sc,var(--accent));background:var(--sc,var(--accent));color:#14101f;border-radius:7px;padding:6px 14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.sugg button{display:flex;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 8px;text-align:left}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--sunk)}
.sugg img,.sugg svg{width:30px;height:30px;border-radius:6px;flex-shrink:0}
.sugg .s-name{font-weight:700;font-size:.9rem}
.sugg .s-cat{font-size:.75rem;color:var(--muted)}
.picked{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.9rem}
.picked img{width:30px;height:30px;border-radius:6px}
.picked .grow{flex:1;min-width:0}
.add-toggle{width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:transparent;padding:10px 14px;color:var(--sc,var(--pc));font-weight:700}
.add-toggle:hover{background:var(--scs,var(--pcs))}
.empty{padding:14px;color:var(--muted);font-size:.9rem}
.new-stage{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:12px;font-family:var(--f-display);font-weight:600;color:var(--muted)}
.new-stage:hover{color:var(--ink);border-color:var(--muted)}

/* espace solo */
.solo-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,var(--pcs),var(--surface) 70%);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:10px;padding:14px 16px}
.solo-head .avatar{width:44px;height:44px;font-size:1.2rem}
.solo-head h2{font-size:1.2rem;color:var(--ink)}
.solo-head .grow{flex:1;min-width:0}
.obj{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:10px;overflow:hidden}
.obj-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 10px}
.grip{cursor:grab;touch-action:none;user-select:none;color:var(--muted);font-size:1.25rem;line-height:1;padding:4px 2px;margin:0 -6px 0 -8px;border-radius:6px}
.grip:hover{color:var(--ink);background:var(--sunk)}
.obj.dragging{box-shadow:0 22px 50px #000c,0 0 0 2px var(--pc);position:relative;z-index:5;cursor:grabbing;scale:1.015}
body.is-dragging{user-select:none;cursor:grabbing}
.obj-check{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:2px solid var(--pc);background:transparent;display:grid;place-items:center;color:#fff;font-weight:800;margin-top:2px}
.obj-check[aria-pressed="true"]{background:var(--pc)}
.obj-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.obj-title{font-family:var(--f-display);font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.obj.complete{position:relative;border-color:#2f7a4f;border-left-color:var(--ok);background:linear-gradient(135deg,#1f5a3acc 0%,#1d3a2e 45%,#1b2e27 100%);box-shadow:0 0 0 1px #4ade8033,0 10px 30px #0a2a1a66}
.obj.complete .obj-title{color:#eafff1}
.obj.complete .bar>i{background:var(--ok)!important}
.obj.complete .bar{background:#0f2a1d}
.obj.complete .desc{color:#b9e6c9}
.obj.complete .ach-list,.obj.complete .obj-add,.obj.complete .add-row{border-color:#2f6b4a}
.obj.complete .ach-row{border-color:#2f6b4a}
.obj.complete .add-toggle{color:#86efac}
.stamp{display:flex;align-items:center;gap:12px;padding:14px 18px 0}
.stamp-ic{width:40px;height:40px;border-radius:50%;background:var(--ok);color:#0d2416;display:grid;place-items:center;font-size:1.4rem;font-weight:900;box-shadow:0 0 0 5px #4ade8033,0 0 24px #4ade8066;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp-t{font-family:var(--f-logo);font-size:2.2rem;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:#86efac;text-shadow:0 0 18px #4ade8066}
.stamp-d{margin-left:auto;font-size:.8rem;color:#b9e6c9}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp-ic{animation:none}}
.vswitch{display:inline-flex;margin-left:auto;background:var(--night);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.vswitch button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.vswitch button .count{font-size:.7rem;background:var(--surface);border-radius:999px;padding:0 7px;color:var(--muted)}
.vswitch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 #ffffff14 inset}
.vswitch button.v-done[aria-selected="true"]{background:#1d3a2e;color:#86efac}
.vswitch button.v-done[aria-selected="true"] .count{background:#2f6b4a;color:#eafff1}
.obj-prog{display:flex;align-items:center;gap:8px}
.obj-prog .bar{flex:1;max-width:220px}
.ach-list{border-top:1px solid var(--line)}
.ach-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.ach-row:last-child{border-bottom:0}
.ach-row>img,.ach-row>svg{width:38px;height:38px;border-radius:8px;display:block}
.ach-row .r-open{border:0;background:transparent;padding:0;text-align:left;min-width:0}
.ach-row .r-open:hover .r-name{text-decoration:underline}
.ach-row.is-done{background:linear-gradient(90deg,#1d3a2ecc,#1d3a2e55);box-shadow:inset 3px 0 0 var(--ok)}
.ach-row.is-done .r-name{color:#c4f5d6}
.r-name{font-weight:700;overflow-wrap:anywhere}
.r-cat{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.state-pill{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1.5px solid var(--pc);color:var(--pc);background:transparent}
button.state-pill:not(:disabled):not(.fin):hover{background:var(--pcs)}
button.state-pill.fin:not(:disabled):hover{filter:brightness(1.1)}
.state-pill.done{background:var(--pc);color:#14101f}
.state-pill.fin{background:var(--ok);border-color:var(--ok);color:#0d2416}
.state-pill.none{border-color:var(--line);color:var(--muted)}
.obj-add{padding:10px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}

/* catalogue */
.cat-list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px;text-align:left}
.cat-row:last-child{border-bottom:0}
.cat-row:hover{background:var(--sunk)}
.cat-row>img,.cat-row>svg{width:42px;height:42px;border-radius:8px}
.cat-row .in{color:var(--gold);font-weight:800}
.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums;border:1.5px solid var(--pc);color:var(--pc);white-space:nowrap}
.pill.done{background:var(--pc);color:#14101f}
.pill.none{border-color:var(--line);color:var(--muted)}
.more{width:100%;border:0;border-top:1px solid var(--line);background:var(--sunk);padding:10px;font-weight:700;color:var(--ink)}

/* fiche succès (style jeu) */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 20px) 12px 24px;overflow-y:auto;z-index:10}
.gcard{width:100%;max-width:48rem;background:var(--g-bg);color:var(--g-ink);border-radius:10px;border:1px solid var(--g-line);box-shadow:0 24px 70px #000a;overflow:hidden;box-sizing:border-box}
.who{display:flex;align-items:stretch;background:var(--night);border-bottom:1px solid var(--g-line)}
.who-lbl{display:flex;align-items:center;padding:0 14px;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--g-muted);font-weight:700}
.who-tab{flex:1;border:0;background:transparent;color:var(--g-muted);padding:12px 10px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:1rem;border-bottom:4px solid transparent}
.who-tab .avatar{opacity:.5}
.who-tab:hover{color:var(--g-ink);background:#ffffff08}
.who-tab[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--pc) 30%,transparent));border-bottom-color:var(--pc)}
.who-tab[aria-selected="true"] .avatar{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 45%,transparent)}
.who-close{border:0;background:transparent;color:var(--g-muted);font-size:1.1rem;padding:0 16px}
.who-close:hover{color:#fff}
.g-body{display:grid;grid-template-columns:170px 1fr}
.g-side{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 14px;border-right:1px solid var(--g-line);background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 24%,var(--g-panel)) 0%,var(--g-panel) 45%)}
.g-icon{width:84px;height:84px;border-radius:50%;padding:4px;background:radial-gradient(circle at 30% 30%,#ffe8a8,#b8862a);box-shadow:0 4px 14px #0008;box-sizing:border-box}
.g-icon img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.g-sep{width:100%;display:flex;align-items:center;gap:8px;color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.g-sep::before,.g-sep::after{content:"";flex:1;height:1px;background:var(--g-line)}
.g-pts{text-align:center}
.g-pts .big{font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.g-pts .of{color:var(--g-muted);font-size:1rem}
.g-pts .lbl{font-size:.8rem;color:var(--g-muted);font-weight:600}
.rewards{display:flex;flex-direction:column;gap:8px;width:100%}
.rw{display:flex;align-items:center;gap:8px;font-size:.8rem;line-height:1.25;color:var(--g-ink);min-width:0}
.rw>span:last-child{min-width:0;overflow-wrap:anywhere}
.rw-ic{width:36px;height:36px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;border:2px solid var(--rc,#5a6377);background:#0004;font-size:1rem;overflow:hidden;box-sizing:border-box}
.rw-ic img{width:100%;height:100%;display:block}
.rw small{display:block;color:var(--g-muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em}
.g-main{padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.g-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.g-title h2{font-size:1.3rem;color:#fff}
.g-badge{font-size:.72rem;font-weight:700;border:1px solid #ffffff30;background:#ffffff10;border-radius:999px;padding:2px 10px;color:#e6e9f2}
.g-crumb{font-size:.78rem;color:var(--g-muted);letter-spacing:.04em}
.g-obj{display:flex;align-items:center;gap:10px;color:var(--g-muted);font-size:.9rem;flex-wrap:wrap}
.g-obj b{color:#fff;font-size:1.05rem;font-variant-numeric:tabular-nums}
.g-obj .bar{flex:1;min-width:80px;max-width:200px;background:#ffffff14}
.g-desc{color:#e4e6ec;font-size:.9rem}
.g-flavor{color:#8fd3e8;font-size:.8rem;font-style:italic}
.g-bits{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.g-bits li{display:flex;align-items:center;gap:10px;background:var(--g-row);border:1px solid transparent;border-radius:6px;padding:8px 12px;font-size:.84rem;font-weight:600;color:#c3c9d8}
.g-bits li .mk{width:18px;flex-shrink:0;text-align:center;color:#6b7590}
.g-bits li.on{background:var(--g-ok-bg);color:var(--g-ok-ink);border-color:#2e5a4a}
.g-bits li.on .mk{color:var(--g-ok)}
.g-note{font-size:.88rem;color:var(--g-muted);background:#ffffff08;border:1px dashed var(--g-line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.g-btn{border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:.85rem}
.g-btn:hover{background:#ffffff22}
.g-btn.primary{background:var(--pc);border-color:var(--pc);color:#14101f}
.avatar.pb,.obj-check.pb[aria-pressed="true"]{color:#2a2410}
.g-foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 22px;border-top:1px solid var(--g-line);background:var(--night)}
.g-links{display:flex;gap:14px;flex-wrap:wrap}
.g-links a{color:#c9cfdd;font-size:.85rem;font-weight:600;text-decoration:none;border-bottom:1px solid #ffffff40}
.g-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.g-add select{background:#0f1420;border:1px solid var(--g-line);color:#fff;border-radius:7px;padding:6px 8px;font-size:.85rem;width:auto;max-width:100%;min-width:0}
.g-ok{color:var(--g-ok);font-size:.85rem;font-weight:700}
@supports not (color:color-mix(in srgb,red,blue)){.who-tab[aria-selected="true"]{background:#ffffff14}.g-side{background:var(--g-panel)}}

/* import */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:40rem;display:flex;flex-direction:column;gap:14px;padding:18px;box-shadow:0 20px 60px #0006;box-sizing:border-box;border-top:5px solid var(--pc)}
.sheet-head{display:flex;gap:14px;align-items:flex-start}
.sheet-head .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.close{border:0;background:var(--sunk);border-radius:50%;width:32px;height:32px;font-size:1rem;flex-shrink:0}
ol.howto{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:8px}
code{font-size:.85em;background:var(--sunk);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
.err{color:var(--danger);font-weight:600;font-size:.9rem}
.foot{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
/* « je suis » */
.me{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.78rem;color:#cfc9ea}
.me-btn{border:1px solid #ffffff30;background:#ffffff10;color:#fff;border-radius:999px;padding:2px 10px 2px 3px;font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
.me-btn .avatar{width:20px;height:20px;font-size:.65rem;opacity:.6}
.me-btn[aria-pressed="true"]{background:var(--pc);border-color:var(--pc)}
.me-btn[aria-pressed="true"] .avatar{opacity:1;box-shadow:0 0 0 2px #fff}
.me-ask{background:var(--gold);color:#1a1f2e;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:700}
.me-ask .me-btn{color:#1a1f2e;border-color:#1a1f2e44;background:#ffffff66}
.carnet-head{--pc:var(--accent);--pcs:var(--accent-soft)}
.carnet-head>.avatar{background:var(--accent);color:#1c1530}
.obj.shared{--pc:var(--c1);--pcs:var(--c1s)}
.obj-checks{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.obj-checks .obj-check{width:26px;height:26px;font-size:.75rem}
.who-mini{display:flex;flex-wrap:wrap;gap:10px}
.who-mini .mini .bar{width:90px;background:var(--line)}
.obj .bar{background:var(--line)}
.task-row .tk{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:1.1rem}
.task-row.is-done .r-name{color:#c4f5d6}
.pchecks{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.add-row{display:flex;border-top:1px dashed var(--line)}
.add-row .add-toggle{border-top:0;flex:1}
.add-row .add-toggle+.add-toggle{border-left:1px dashed var(--line)}

/* infobulle objet */
.tip{position:fixed;z-index:50;pointer-events:none;width:300px;max-width:calc(100vw - 24px);background:#1b2029f2;border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 14px 40px #000b;font-size:.85rem;line-height:1.45;color:#e9ecf3;backdrop-filter:blur(4px)}
.tip-h{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.tip-h img{width:52px;height:52px;border-radius:6px;border:2px solid var(--rc,#555)}
.tip-n{font-weight:700;font-size:1.05rem;color:var(--rc,#fff);line-height:1.25}
.tip-at{color:#e9ecf3}.tip-at b{color:#4ade80;font-weight:600}
.tip-sl{display:flex;align-items:center;gap:6px;margin-top:8px;color:#d6d9e2}
.tip-sl i{width:12px;height:12px;border-radius:50%;border:2px solid #9aa4ba;display:inline-block}
.tip-d{color:#c9cfdd;margin-top:8px;font-style:italic}
.tip-m{margin-top:8px;color:#d6d9e2}
.tip-r{color:var(--rc,#fff)}
.tip-c{margin-top:8px;display:flex;gap:8px;font-weight:700}
.tip-c .g{color:#f5c35b}.tip-c .s{color:#c0c4cc}.tip-c .c{color:#c87b45}
.tip-load{color:var(--muted)}

.tip.tip-ach{width:460px;padding:0;overflow:hidden}
.ta{display:grid;grid-template-columns:130px 1fr}
.ta-side{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 10px;border-right:1px solid var(--line);background:#00000025}
.ta-side .g-icon{width:64px;height:64px}
.ta-main{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ta-n{font-weight:800;font-size:1.05rem;color:#fff}
.ta-d{color:#e4e6ec}

/* fiche : sous-succès, collections */
.g-back{border:0;background:transparent;color:var(--g-muted);font-weight:700;font-size:.85rem;padding:0;text-align:left;align-self:flex-start}
.g-back:hover{color:#fff}
.g-level{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--g-muted);font-size:.9rem}
.g-level b{color:#fff;font-size:1.05rem;font-variant-numeric:tabular-nums}
.g-sub-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.g-sub-head h3{font-size:1rem;color:#fff}
.g-subs{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto;padding-right:4px}
.g-sub{display:grid;grid-template-columns:auto 1fr 120px;gap:12px;align-items:center;background:var(--g-row);border:1px solid transparent;border-radius:6px;padding:7px 10px;text-align:left;color:#dfe3ee;font-weight:600;font-size:.9rem;width:100%}
.g-sub:hover{border-color:#ffffff30}
.g-sub img{width:28px;height:28px;border-radius:6px;display:block}
.g-sub.on{background:var(--g-ok-bg);border-color:#2e5a4a;color:var(--g-ok-ink)}
.g-sub .done-lbl{color:var(--g-ok);font-weight:800;font-size:.8rem;text-align:right}
.g-sub .bar{background:#ffffff12;height:8px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1;border:2px solid var(--rc,#3a4256);border-radius:6px;padding:0;background:#0006;overflow:hidden;max-width:100%}
.tile img{width:100%;height:100%;display:block;filter:grayscale(1) brightness(.45);transition:filter .2s}
.tile.lit img{filter:none}
.tile.on::after{content:"✓";position:absolute;right:1px;bottom:0;font-size:.62rem;font-weight:900;color:#fff;background:var(--g-ok);border-radius:4px 0 0 0;padding:0 3px;line-height:1.3}
.tile[aria-pressed="true"]{outline:2px solid #fff;outline-offset:1px}
.tile .ph{display:grid;place-items:center;width:100%;height:100%;color:var(--g-muted);font-size:.7rem}
.g-item{display:flex;gap:14px;align-items:flex-start;background:#0f1420;border:1px solid var(--g-line);border-radius:10px;padding:12px}
.g-item .big{width:64px;height:64px;border-radius:8px;border:2px solid var(--rc,#3a4256);flex-shrink:0;overflow:hidden;background:#0006}
.g-item .big img{width:100%;height:100%;display:block}
.g-item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.g-item .nm{font-weight:700;font-size:1.05rem;color:var(--rc,#fff)}
.g-item .meta{font-size:.8rem;color:var(--g-muted)}
.g-item .dsc{font-size:.85rem;color:#c9cfdd}
.g-texts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}

@media (prefers-reduced-motion:reduce){.bar>i{transition:none}.tile img{transition:none}}
@media (max-width:600px){
  .g-sub{grid-template-columns:auto 1fr 70px}
  .g-body{grid-template-columns:1fr}
  .g-side{border-right:0;border-bottom:1px solid var(--g-line);flex-direction:row;flex-wrap:wrap;justify-content:center;padding:16px}
  .g-sep{display:none}
  .rewards{flex:1 1 100%}
  .who-lbl{display:none}
  .g-main{padding:16px}
  .g-foot{padding:12px 16px}
}
@media (max-width:520px){li.item{grid-template-columns:auto 1fr}li.item>.icons{grid-column:1/-1;justify-content:flex-end}.banner h1{font-size:1.6rem}.cat-row{grid-template-columns:auto 1fr}.cat-row .pills{grid-column:2;justify-content:flex-start}.ach-row{grid-template-columns:auto 1fr auto}.ach-row>.state-pill{grid-column:2;justify-self:start}}

.state-pill.multi{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 2px}
.state-pill.multi .avatar{width:20px;height:20px;font-size:.6rem}
.state-pill.multi.fin .avatar{box-shadow:0 0 0 2px #0d2416}
.mini .avatar,.obj-prog .avatar{width:20px;height:20px;font-size:.6rem}
.obj-check.av{border:none;padding:0;position:relative;background:none}
.obj-check.av .avatar{width:100%;height:100%;font-size:.7rem;opacity:.55;box-shadow:0 0 0 2px var(--line)}
.obj-check.av[aria-pressed="true"]{background:none}
.obj-check.av[aria-pressed="true"] .avatar{opacity:1;box-shadow:0 0 0 2px var(--ok)}
.obj-check.av .ck{position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;border-radius:50%;background:var(--ok);color:#0d2416;font-size:.6rem;font-weight:900;display:grid;place-items:center}
.task-row{grid-template-columns:1fr auto auto!important}
.t-check{display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px 0;text-align:left;color:inherit;cursor:pointer;min-width:0;width:100%}
.t-check:disabled{cursor:default}
.t-box{width:24px;height:24px;flex-shrink:0;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;font-size:.9rem;color:#0d2416;transition:background .15s,border-color .15s}
.t-check:not(:disabled):hover .t-box{border-color:var(--ok)}
.t-check[aria-checked="true"] .t-box{background:var(--ok);border-color:var(--ok)}
.t-check[aria-checked="true"] .r-name{text-decoration:line-through;text-decoration-color:#4ade8088}

<body>

<script>
(function(){
  "use strict";

  var me = null;

  try{ var sv = JSON.parse(localStorage.getItem('gw2-ui')||'{}'); if(sv.cf) ui.cf = sv.cf; }catch(e){}

  function saveUi(){ try{ localStorage.setItem('gw2-ui', JSON.stringify({cf:ui.cf})); }catch(e){} }
  function setMe(p){ me = p; try{ localStorage.setItem('gw2-me', p); }catch(e){} ui.tab = p; trackPresence(); touchSeen(); render(); }

  /* ---------- outils ---------- */
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function h(tag, props, kids){

  }
  var SVGNS='http://www.w3.org/2000/svg';
  function shield(){
    var s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox','0 0 44 44'); s.setAttribute('aria-hidden','true');

  }
  function norm(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }

    var span = h('span'), ws = words(q); if(!ws.length){ span.textContent=text; return span; }
    var n = norm(text), marks = [];

    var pos=0; marks.forEach(function(m){ if(m[0]<pos) return; span.appendChild(document.createTextNode(text.slice(pos,m[0]))); span.appendChild(h('mark',{text:text.slice(m[0],m[1])})); pos=m[1]; });
    span.appendChild(document.createTextNode(text.slice(pos))); return span;
  }
  function pct(x){ return x[1] ? Math.min(100,Math.round(x[0]/x[1]*100)) : 0; }
  function bar(x,color){ return h('div',{class:'bar'},[h('i',{style:'width:'+pct(x)+'%;background:'+color})]); }
  function fmtDate(iso){ try{ var d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
  function achLink(id){ return 'https://gw2.app/fr/achievements/'+id; }
  function wikiLink(name){ return 'https://wiki-fr.guildwars2.com/index.php?search='+encodeURIComponent(name); }
  var pics = {};
  function avatar(p){ var el = h('span',{class:'avatar p'+p}); if(pics[p]) el.appendChild(h('img',{src:pics[p], alt:''})); else el.textContent = state.players[p].slice(0,1).toUpperCase(); return el; }
  function pickPhoto(p){
    var inp = h('input',{type:'file', accept:'image/*'});
    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0]; if(!f) return;
      createImageBitmap(f).then(function(bm){
        var s = Math.min(bm.width, bm.height), cv = document.createElement('canvas'); cv.width = cv.height = 160;
        cv.getContext('2d').drawImage(bm, (bm.width-s)/2, (bm.height-s)/2, s, s, 0, 0, 160, 160);
        var url = cv.toDataURL('image/webp', .85); if(url.indexOf('data:image/webp')!==0) url = cv.toDataURL('image/jpeg', .85);
        pics[p] = url; queue('avatar-'+p, {img:url}); render();
      }).catch(function(){ alertMsg('Cette image n’a pas pu être lue.'); });
    });
    inp.click();
  }
  function alertMsg(t){ syncErr = t; render(); }
  /* présence et points gagnés depuis la création */
  var online = {}, seen = {}, bases = {}, presCh = null;
  function ago(iso){ var m = Math.round((Date.now()-new Date(iso).getTime())/60000); if(m<1) return 'à l’instant'; if(m<60) return 'il y a '+m+' min'; var hh = Math.round(m/60); if(hh<24) return 'il y a '+hh+' h'; var d = Math.round(hh/24); return 'il y a '+d+' j'; }
  function touchSeen(){ if(!SB || !me || status==='login') return; var at = new Date().toISOString(); seen[me] = {at:at}; try{ SB.from('carnet').upsert([{id:'seen-'+me, data:{at:at}, updated_at:at}]).then(function(){}, function(){}); }catch(e){} }
  function trackPresence(){ if(presCh && me) presCh.track({p:me, at:new Date().toISOString()}); }
  function ensureBase(p){
    if(p!==me || bases[p] || !hasProg(p) || !catalog || !D) return;
    var ap = apOf(p); if(ap==null) return;
    bases[p] = {ap:ap, n:prog[p].n, at:new Date().toISOString()}; queue('base-'+p, bases[p]);
  }
  /* points de succès : somme des paliers atteints + points quotidiens/mensuels historiques */
  function apOf(p){
    if(!hasProg(p) || !catalog) return null;
    var d = prog[p].d, tot = 0;
    for(var id in d){ var a = A(+id); if(!a) continue; var e = earned(a,p); if(e) tot += e; }
    var acc = prog[p].acc; if(acc) tot += (acc.dap||0) + (acc.map||0);
    return tot;
  }
  function nm(p){ return state.players[p]; }

  /* ---------- catalogue + détails ---------- */
  var byId = {}, byCat = {};
  function prepCatalog(c){
    c.A.forEach(function(a){ a.n = norm(a[1]); a.r = norm(a[2]); byId[a[0]] = a; (byCat[a[3]] = byCat[a[3]] || []).push(a); });
    c.groups = []; var seen = {};
    c.C.forEach(function(cat){ if(!seen[cat[2]]){ seen[cat[2]]=1; c.groups.push(cat[2]); } });
    return c;
  }
  function A(id){ return byId[id]; }
  function catOf(a){ return catalog.C[a[3]]; }
  function achIconSrc(a){ if(D && D.K['a'+a[0]]!=null) return D.L[D.K['a'+a[0]]]; var c=catOf(a); return c && c[3] || null; }
  function iconEl(a){ var s = a && achIconSrc(a); return s ? h('img',{src:s, alt:'', loading:'lazy'}) : shield(); }
  function bitInfo(b){ var i=b.indexOf('|'); var k=b.slice(0,1); return {kind:k, id:k==='T'?null:b.slice(1,i), text:b.slice(i+1)}; }
  var KIND = {I:'Objet', S:'Apparence', M:'Miniature'};
  function det(a){ return (D && D.F[a[0]]) || ['','','']; }
  function isMeta(a){ return !!CD[a[0]]; }
  function subsOf(a){ return (byCat[a[3]]||[]).filter(function(x){ return x[0]!==a[0] && !CD[x[0]]; }); }
  var FLAG = {U:'Nécessite un déverrouillage', R:'Répétable', D:'Quotidien', W:'Hebdomadaire', M:'Mensuel', H:'Caché'};
  var REGION = {T:['Tyrie centrale','#d0453a'], G:['Maguuma','#3faa55'], D:['Désert de Cristal','#c55db5'], N:['Toundra','#4b93e0'], J:['Cantha','#22b3a7'], S:['Ciel','#8fb6ea'], W:['Janthir','#b08a4b'], M:['Magie','#9a7ae8']};
  var RARITY = {Junk:'#aaaaaa',Basic:'#d8d8d8',Fine:'#62a4da',Masterwork:'#1a9306',Rare:'#fcd00b',Exotic:'#ffa405',Ascended:'#fb3e8d',Legendary:'#9b4dff'};
  var RARITY_FR = {Junk:'Inutile',Basic:'Simple',Fine:'Raffiné',Masterwork:'Chef-d’œuvre',Rare:'Rare',Exotic:'Exotique',Ascended:'Élevé',Legendary:'Légendaire'};
  var TYPE_FR = {Trophy:'Trophée',Consumable:'Consommable',Container:'Conteneur',CraftingMaterial:'Matériau d’artisanat',Weapon:'Arme',Armor:'Armure',Back:'Dos',Trinket:'Colifichet',Gizmo:'Gadget',UpgradeComponent:'Amélioration',MiniPet:'Miniature',Gathering:'Outil de récolte',Tool:'Outil',Bag:'Sac',Mount:'Monture'};

  /* ---------- icônes de collection (chargées à la demande) ---------- */
  function colKey(b){ var bi=bitInfo(b); return bi.kind!=='T' ? bi.kind+bi.id : null; }
  function needCol(a){
    var keys = a[6].map(colKey).filter(Boolean); if(!keys.length) return;
    var want = {}; keys.forEach(function(k){ var s = (+k.slice(1))%12; if(!shardsLoaded[s]) want[s]=1; });
    var jobs = Object.keys(want).map(function(s){ shardsLoaded[s]='loading'; return getJSON('data/col-icons-'+s+'.json').then(function(m){ for(var k in m) icons[k]=m[k]; shardsLoaded[s]=1; }).catch(function(){ shardsLoaded[s]=0; }); });
    if(!CI) jobs.push(getJSON('data/col-info.json').then(function(x){ CI = x; }).catch(function(){}));
    if(jobs.length) Promise.all(jobs).then(function(){ renderSheet(); });
  }

  /* ---------- progression API ---------- */
  function hasProg(p){ return !!(prog[p] && prog[p].d); }
  function pr(p,id){ if(!hasProg(p)) return null; return prog[p].d[id] || [0,0,0,[]]; }
  function apiDone(p,id){ var x=pr(p,id); return !!(x && x[2]); }
  function apiBit(p,id,i){ var x=pr(p,id); return !!(x && (x[2] || (x[3]||[]).indexOf(i)>-1)); }
  function achCount(a,p){ var x=pr(p,a[0]); if(!x) return null; var max = x[1] || a[5] || (a[6].length||1); var cur = x[2] ? max : Math.min(x[0]||0, max); return [cur,max]; }
  function tiers(a){ var t = det(a)[2]; return t ? t.split(',').map(function(s){ var q=s.split(':'); return [+q[0],+q[1]]; }) : null; }
  function earned(a,p){
    var x = pr(p,a[0]); if(!x) return null; if(x[2]) return a[4];
    var t = tiers(a); if(!t) return 0;
    return t.reduce(function(s,q){ return s + ((x[0]||0) >= q[0] ? q[1] : 0); },0);
  }
  function level(a,p){ var t = tiers(a); if(!t || t.length<2) return null; var x = pr(p,a[0]); var cur = !x ? null : (x[2] ? t.length : t.filter(function(q){ return (x[0]||0)>=q[0]; }).length); return [cur, t.length]; }

  /* ---------- objectifs (carnet commun et solo, même système) ---------- */
  function migrate(s){
    if(s.v===2 && s.lists) return s;
    var lists = {carnet:[], a:[], b:[]};
    (s.stages||[]).forEach(function(st){
      var o = {id:st.id||uid(), title:st.title, desc:'', achs:[], tasks:[], done:{}};
      (st.items||[]).forEach(function(it){
        if(it.ach) o.achs.push({id:it.ach.id, m:{a:!!(it.done&&it.done.a), b:!!(it.done&&it.done.b)}});
        else o.tasks.push({id:it.id||uid(), t:it.text+(it.note?' — '+it.note:''), m:{a:!!(it.done&&it.done.a), b:!!(it.done&&it.done.b)}});
      });
      lists.carnet.push(o);
    });
    ['a','b'].forEach(function(p){
      ((s.solo||{})[p]||[]).forEach(function(o){
        var m = {}; m[p] = !!o.done;
        lists[p].push({id:o.id||uid(), title:o.title, desc:o.desc||'', achs:(o.achs||[]).map(function(x){ var mm={}; mm[p]=!!x.done; return {id:x.id, m:mm}; }), tasks:[], done:m});
      });
    });
    return {v:2, players:s.players||{a:'Nymos',b:'Jeff'}, lists:lists};
  }
  function list(key){ state.lists[key] = state.lists[key] || []; return state.lists[key]; }
  function achDone(p,x){ if(apiDone(p,x.id)) return 'api'; return x.m && x.m[p] ? 'man' : false; }

  function objTally(p,o){ var d=0, n=0; (o.achs||[]).forEach(function(x){ n++; if(achDone(p,x)) d++; }); (o.tasks||[]).forEach(function(t){ n++; if(taskDone(p,t)) d++; }); return [d,n]; }
  function objDone(p,o){ if(o.done && o.done[p]) return true; var t=objTally(p,o); return t[1]>0 && t[0]===t[1]; }
  function listTally(key,p){ var l=list(key); return [l.filter(function(o){return objDone(p,o);}).length, l.length]; }
  function tracked(id){ var out=[]; ['carnet','a','b'].forEach(function(k){ list(k).forEach(function(o){ if((o.achs||[]).some(function(x){return x.id===id;})) out.push([k,o]); }); }); return out; }
  function addAchTo(key, objId, achIds){
    var o = list(key).filter(function(x){return x.id===objId;})[0]; if(!o) return 0;
    o.achs = o.achs||[]; var n=0;
    achIds.forEach(function(id){ if(!o.achs.some(function(x){return x.id===id;})){ o.achs.push({id:id, m:{}}); n++; } });
    if(n) changed(); return n;
  }
  function listLabel(key){ return key==='carnet' ? 'Notre carnet' : 'Objectifs de '+nm(key); }

  /* ---------- sauvegarde partagée (Supabase) ---------- */
  var SB = null, session = null, lastSave = 0, timer = null, pending = {};
  function queue(id, data){
    pending[id] = data;

    clearTimeout(timer); timer = setTimeout(flush, 900);
  }
  function flush(){
    var ids = Object.keys(pending); if(!ids.length || !SB) return;
    var rows = ids.map(function(id){ return {id:id, data:pending[id], updated_at:new Date().toISOString()}; }); pending = {};
    lastSave = Date.now();
    SB.from('carnet').upsert(rows).then(function(r){
      if(r.error){ status='err'; errMsg = r.error.message; rows.forEach(function(x){ if(!pending[x.id]) pending[x.id]=x.data; }); }
      else { status='ok'; errMsg=''; }
      paintStatus();
    });
  }
  var errMsg = '';
  function changed(){ render(); queue('state', state); }
  var statusText = {wait:'Connexion…', saving:'Enregistrement…', ok:'Enregistré pour vous deux', login:'Non connecté', err:'Échec de l’enregistrement, réessayez'};
  function paintStatus(){ var el=document.getElementById('status'); if(!el) return; el.setAttribute('data-s',status); el.lastChild.textContent=statusText[status]+(status==='err'&&errMsg?' ('+errMsg+')':''); }
  function readOnly(){ return status==='login' || status==='wait'; }
  function armDelete(key, fn){
    if(ui.arm===key){ ui.arm=null; fn(); changed(); return; }
    ui.arm=key; render(); setTimeout(function(){ if(ui.arm===key){ ui.arm=null; render(); } }, 3500);
  }

  /* ---------- recherche dans le catalogue ---------- */
  function searchCatalog(q, max){
    var ws = words(q); if(!ws.length || !catalog) return [];
    var out = [];
    for(var i=0;i<catalog.A.length;i++){
      var a = catalog.A[i];
      if(ws.every(function(w){ return a.n.indexOf(w)>-1; })) out.push([0,a]);

    }

    out.sort(function(x,y){ return (x[0]-y[0]) || ((x[1].n.indexOf(nq)===0?0:1)-(y[1].n.indexOf(nq)===0?0:1)) || (x[1].n.length-y[1].n.length); });
    return out.slice(0,max||1e9).map(function(x){return x[1];});
  }
  function suggestions(q, onPick, n){

    return h('div',{class:'sugg'}, res.map(function(a){
      return h('button',{type:'button', onclick:function(){ onPick(a); }},[ iconEl(a), h('div',{},[ h('div',{class:'s-name'},[hl(a[1],q)]), h('div',{class:'s-cat',text:catOf(a)[2]+' › '+catOf(a)[1]+' · '+a[4]+' pts'}) ]) ]);
    }));
  }
  function openSheet(id, p){ ui.hist = []; ui.item = null; ui.sheet = {id:id, p:p || (ui.sheet&&ui.sheet.p) || me || (ui.tab==='a'||ui.tab==='b'?ui.tab:'a')}; renderSheet(); }
  function goSub(id){ ui.hist.push(ui.sheet.id); ui.item=null; ui.sheet = {id:id, p:ui.sheet.p}; renderSheet(); var s=layer.querySelector('.scrim'); if(s) s.scrollTop=0; }

  /* ---------- infobulle des objets (API du jeu, chargée au survol) ---------- */
  var tipCache = {}, tipEl = null, tipKey = null;
  var ATTR = {Power:'Puissance',Precision:'Précision',Toughness:'Robustesse',Vitality:'Vitalité',ConditionDamage:'Dégâts par altération',CritDamage:'Férocité',Healing:'Guérison',BoonDuration:'Concentration',ConditionDuration:'Expertise',AgonyResistance:'Résistance à l’agonie'};

  /* ---------- clé API et synchro automatique ---------- */
  var syncing = false, syncErr = '';
  function getKey(){ try{ return me ? localStorage.getItem('gw2-key-'+me) : null; }catch(e){ return null; } }
  function setKey(k){ try{ if(k) localStorage.setItem('gw2-key-'+me, k); else localStorage.removeItem('gw2-key-'+me); }catch(e){} }
  function compact(data){ var d = {}, n = 0; data.forEach(function(x){ if(x && x.id!=null){ d[x.id] = [x.current||0, x.max||0, x.done?1:0, x.bits||[]]; if(x.done) n++; } }); return {d:d, n:n}; }
  function syncGame(force){
    var k = getKey(); if(!k || !me || syncing || status==='login') return Promise.resolve();
    syncing = true; if(force) render();
    return fetch('https://api.guildwars2.com/v2/account/achievements?access_token='+encodeURIComponent(k))
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      syncing = false;
      if(!res.ok || !Array.isArray(res.j)){ syncErr = 'Clé refusée par le jeu : '+((res.j&&res.j.text)||'erreur'); render(); return; }
      syncErr = '';
      var c = compact(res.j), old = prog[me] && prog[me].d, oldAcc = prog[me] && prog[me].acc;
      return fetch('https://api.guildwars2.com/v2/account?access_token='+encodeURIComponent(k)).then(function(r){ return r.json(); }).catch(function(){ return null; }).then(function(a){
        var acc = a && a.name ? {name:a.name, dap:a.daily_ap||0, map:a.monthly_ap||0} : oldAcc;
        var oldChars = prog[me] && prog[me].chars;
        return fetch('https://api.guildwars2.com/v2/characters?ids=all&access_token='+encodeURIComponent(k)).then(function(r){ return r.ok ? r.json() : 'noperm'; }).catch(function(){ return null; }).then(function(cs){
          var chars = Array.isArray(cs) ? cs.map(function(x){ return {n:x.name, p:x.profession, r:x.race, l:x.level, g:x.gender, age:x.age, at:x.created}; }) : (cs==='noperm' ? 'noperm' : oldChars);
          var same = old && JSON.stringify(old)===JSON.stringify(c.d) && JSON.stringify(oldAcc||null)===JSON.stringify(acc||null) && JSON.stringify(oldChars||null)===JSON.stringify(chars||null);
          var stale = !prog[me] || (Date.now() - new Date(prog[me].at).getTime() > 3600e3);
          prog[me] = {at:new Date().toISOString(), n:c.n, d:c.d, acc:acc, chars:chars}; ensureBase(me);
          if(!same || stale || force) queue('progress-'+me, prog[me]);
          render();
        });
      });
    }).catch(function(){ syncing = false; syncErr = 'Impossible de joindre l’API du jeu'; render(); });
  }
  setInterval(function(){ if(document.visibilityState==='visible') syncGame(false); }, 5*60*1000);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && prog[me] && Date.now()-new Date(prog[me].at).getTime() > 4*60*1000) syncGame(false); });

  function openImport(p){ ui.importFor=p; renderSheet(); }
  function importSheet(p){
    var key = h('input',{type:'password', id:'imp-key', placeholder:'Collez votre clé API ici', autocomplete:'off', value:getKey()||''});
    var msg = h('div',{class:'err', role:'alert'});
    function back(){ ui.importFor=null; renderSheet(); }
    var sheet = h('div',{class:'sheet p'+p, role:'dialog', 'aria-modal':'true', 'aria-label':'Clé API'},[
      h('div',{class:'sheet-head'},[ avatar(p), h('div',{class:'grow'},[ h('div',{class:'eyebrow',text:'Progression du jeu'}), h('h2',{text:'Clé API de '+nm(p)}) ]), h('button',{class:'close','aria-label':'Fermer',text:'✕',onclick:back}) ]),
      h('ol',{class:'howto'},[
        h('li',{},[ 'Créez une clé sur ', h('a',{class:'lnk', href:'https://account.arena.net/applications', target:'_blank', rel:'noopener', text:'account.arena.net › Applications ↗'}), ' avec les droits ', h('code',{text:'account'}), ', ', h('code',{text:'progression'}), ' et ', h('code',{text:'characters'}), '.' ]),
        h('li',{},[ 'Collez-la ici. Le carnet se synchronisera tout seul à chaque ouverture, puis toutes les 5 minutes.', h('div',{style:'margin-top:6px'},[ key ]) ])
      ]),
      h('p',{class:'hint',text:'La clé reste uniquement dans ce navigateur. Seule la liste de vos succès est enregistrée dans le carnet, pour que l’autre joueur la voie.'}),
      msg,
      h('div',{class:'actions'},[
        getKey() ? h('button',{class:'btn ghost', text:'Oublier la clé', onclick:function(){ setKey(null); back(); render(); }}) : null,
        h('button',{class:'btn ghost', text:'Annuler', onclick:back}),
        h('button',{class:'btn', style:'background:'+PCOL[p]+';border-color:'+PCOL[p], text:'Enregistrer et synchroniser', onclick:function(){
          var k = key.value.trim(); if(!k){ msg.textContent='Collez d’abord la clé.'; return; }
          msg.textContent='Vérification…';
          fetch('https://api.guildwars2.com/v2/tokeninfo?access_token='+encodeURIComponent(k)).then(function(r){ return r.json(); }).then(function(t){
            if(!t || !t.permissions){ msg.textContent='Clé refusée : '+((t&&t.text)||'inconnue'); return; }
            if(t.permissions.indexOf('progression')<0 || t.permissions.indexOf('account')<0){ msg.textContent='Il manque les droits account et progression à cette clé.'; return; }
            if(t.permissions.indexOf('characters')<0) syncErr = 'Astuce : ajoute le droit « characters » à ta clé pour voir tes personnages.';
            setKey(k); ui.importFor=null; renderSheet(); syncGame(true);
          }).catch(function(){ msg.textContent='Impossible de joindre l’API du jeu.'; });
        }})
      ])
    ]);
    var scrim = h('div',{class:'scrim', onclick:function(e){ if(e.target===scrim) back(); }},[sheet]);
    setTimeout(function(){ key.focus(); },0);
    return scrim;
  }

  /* ---------- connexion ---------- */
  function renderLogin(){
    app.textContent = '';
    var email = h('input',{type:'text', id:'login-mail', placeholder:'ton@adresse.fr', autocomplete:'email', inputmode:'email'});
    var msg = h('div',{class:'hint', role:'status'});
    app.appendChild(h('header',{class:'banner'},[ h('div',{},[ h('div',{class:'eyebrow',text:'Guild Wars 2 · objectifs à deux'}), h('h1',{text:'Carnet de Tyrie'}) ]) ]));
    app.appendChild(h('form',{class:'sheet', style:'--pc:var(--accent);max-width:28rem;margin:0 auto', onsubmit:function(e){
      e.preventDefault(); var m = email.value.trim(); if(!m) return;
      msg.textContent = 'Envoi…';
      SB.auth.signInWithOtp({email:m, options:{emailRedirectTo: location.origin+location.pathname}}).then(function(r){
        msg.textContent = r.error ? 'Erreur : '+r.error.message : 'Lien envoyé à '+m+'. Ouvre-le depuis ce navigateur pour te connecter.';
      });
    }},[ h('h2',{text:'Connexion'}), h('p',{class:'hint',text:'Entre ton adresse e-mail : tu recevras un lien de connexion, sans mot de passe.'}), h('label',{class:'fld','for':'login-mail'},['Adresse e-mail', email]), h('div',{class:'actions'},[ h('button',{type:'submit', class:'btn', text:'Recevoir le lien'}) ]), msg ]));
  }

  /* ---------- démarrage ---------- */
  function getJSON(path){ return fetch(path).then(function(r){ if(!r.ok) throw new Error(path); return r.json(); }); }
  function loadStatic(){
    getJSON('data/catalog.json').then(function(c){ catalog = prepCatalog(c); render(); return getJSON('data/details.json'); })
    .then(function(d){ D = d; (d.CD||[]).forEach(function(id){ CD[id]=1; }); ensureBase(me); render(); }).catch(function(){ render(); });
  }
  function loadDb(){
    return SB.from('carnet').select('id,data').then(function(r){
      if(r.error){ status='err'; errMsg=r.error.message; state = migrate({}); render(); return; }
      var rows = {}; (r.data||[]).forEach(function(x){ rows[x.id]=x.data; });
      if(!rows.state){
        // rien de visible : soit le carnet est tout neuf, soit cette adresse n'a pas accès. On essaie de le créer pour savoir.
        var fresh = migrate({});
        return SB.from('carnet').insert([{id:'state', data:fresh, updated_at:new Date().toISOString()}]).then(function(w){
          if(w.error){ status = 'login'; renderPrivate(); return; }
          rows.state = fresh; startDb(rows);
        });
      }
      startDb(rows);
    });
  }
  function renderPrivate(){
    app.textContent = '';
    var mail = session && session.user && session.user.email;
    app.appendChild(h('header',{class:'banner'},[ h('div',{},[ h('div',{class:'eyebrow',text:'Guild Wars 2 · objectifs à deux'}), h('h1',{text:'Carnet de Tyrie'}) ]) ]));
    app.appendChild(h('div',{class:'sheet private', style:'--pc:var(--accent);max-width:30rem;margin:0 auto;text-align:center'},[
      h('div',{class:'private-ico','aria-hidden':'true',text:'🔒'}),
      h('h2',{text:'Carnet privé'}),
      h('p',{class:'hint',text:'Ce carnet est réservé à ses deux propriétaires.'+(mail ? ' Tu es connecté avec '+mail+', qui n’a pas accès.' : '')}),
      h('p',{class:'hint',text:'Si tu t’es trompé d’adresse, déconnecte-toi et réessaie avec la bonne.'}),
      h('div',{class:'actions',style:'justify-content:center'},[ h('button',{class:'btn', text:'Se déconnecter', onclick:function(){ SB.auth.signOut(); }}) ])
    ]));
  }
  function startDb(rows){
    (function(){ // eslint-disable-line
      state = migrate(rows.state || {});
      if(state.players && state.players.b==='Jpawals'){ state.players.b = 'Jeff'; queue('state', state); }
      ['a','b'].forEach(function(p){ var x = rows['progress-'+p]; if(x && x.d) prog[p]=x; var av = rows['avatar-'+p]; if(av && av.img) pics[p]=av.img; if(rows['seen-'+p]) seen[p]=rows['seen-'+p]; if(rows['base-'+p]) bases[p]=rows['base-'+p]; });
      status = 'ok'; render();
      SB.channel('carnet').on('postgres_changes',{event:'*', schema:'public', table:'carnet'}, function(ev){
        var row = ev.new; if(!row || !row.id) return;
        if(row.id==='state'){ if(Date.now()-lastSave < 4000 || pending.state || ui.editing || ui.addTask) return; state = migrate(row.data); }
        else if(row.id.indexOf('seen-')===0){ seen[row.id.slice(5)] = row.data; }
        else if(row.id.indexOf('base-')===0){ bases[row.id.slice(5)] = row.data; }
        else if(row.id.indexOf('avatar-')===0){ if(row.data && row.data.img) pics[row.id.slice(7)] = row.data.img; }
        else if(row.id.indexOf('progress-')===0){ var p=row.id.slice(9); if(p!==me || !syncing) prog[p]=row.data; }
        render();
      }).subscribe();
      presCh = SB.channel('presence-carnet', {config:{presence:{key: (session && session.user && session.user.id) || 'x'}}});
      presCh.on('presence', {event:'sync'}, function(){
        var st = presCh.presenceState(), o = {};
        Object.keys(st).forEach(function(k){ (st[k]||[]).forEach(function(m){ if(m && m.p) o[m.p] = true; }); });
        online = o; render();
      }).subscribe(function(stt){ if(stt==='SUBSCRIBED') trackPresence(); });
      touchSeen(); setInterval(function(){ if(document.visibilityState==='visible') touchSeen(); }, 3*60*1000);
      setInterval(function(){ if(!ui.sheet && !ui.importFor && !ui.editing && !ui.addAch && !ui.addTask && document.visibilityState==='visible') render(); }, 60*1000);
      syncGame(false);
    })();
  }
  if(!window.supabase || !window.CARNET_CONFIG || /A_REMPLIR/.test(window.CARNET_CONFIG.url)){
    app.textContent=''; app.appendChild(h('div',{class:'sheet', style:'--pc:var(--danger)'},[ h('h2',{text:'Configuration manquante'}), h('p',{class:'hint',text:'Le fichier config.js doit contenir l’adresse et la clé publique du projet Supabase.'}) ]));
  } else {
