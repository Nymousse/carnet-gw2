<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet GW2 Nymos &amp; Elodie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: bannière nuit de Tyrie + 4 onglets (carnet commun, Nymos, Elodie, catalogue). Bleu = Nymos, rose = Elodie. Fiche succès en panneau sombre façon jeu */
/* Thème unique sombre, calqué sur gw2.app : fond ardoise, cartes gris-bleu, accents rose et violet */
:root{
  --bg:#1c212b; --surface:#29303c; --sunk:#222833; --ink:#f2f2f2; --muted:#a3a3ad; --line:#414458;
  --night:#0e1116; --night-2:#3b2470; --gold:#f5c35b; --on-night:#f2f2f2;
  --pa:#5ab4ff; --pa-soft:#1b3348; --pb:#ff7ac6; --pb-soft:#4a2140;
  --accent:#b48af8; --accent-soft:#2f2747;
  --c0:#b48af8; --c0s:#2f2747; --c1:#b48af8; --c1s:#2f2747; --c2:#3fc8b4; --c2s:#10302b; --c3:#f27468; --c3s:#3a1a18; --c4:#7cc95a; --c4s:#1a2e14;
  --ok:#4ade80; --ok-soft:#173326; --danger:#f87171; --scrim:#05070cc0;
  --g-bg:#252c38; --g-panel:#1f252f; --g-line:#414458; --g-ink:#f2f2f2; --g-muted:#a3a3ad; --g-ok:#4ade80; --g-ok-bg:#1d3a2e; --g-ok-ink:#c4f5d6; --g-row:#2e3644;
  --f-display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-logo:"VT323",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
#app{max-width:52rem;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer} button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--pb);outline-offset:2px}
a{color:inherit}
.c0{--sc:var(--c0);--scs:var(--c0s)} .c1{--sc:var(--c1);--scs:var(--c1s)} .c2{--sc:var(--c2);--scs:var(--c2s)} .c3{--sc:var(--c3);--scs:var(--c3s)} .c4{--sc:var(--c4);--scs:var(--c4s)}
.pa{--pc:var(--pa);--pcs:var(--pa-soft)} .pb{--pc:var(--pb);--pcs:var(--pb-soft)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;white-space:nowrap}
.bar{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s}
.hint{font-size:.88rem;color:var(--muted)}
mark{background:var(--gold);color:#1a1f2e;border-radius:2px;padding:0 1px}

/* bannière */
.banner{border-radius:12px;padding:18px 20px 16px;color:var(--on-night);border:1px solid var(--line);background:
  radial-gradient(90% 160% at 0% 0%, #5b1f4f 0%, transparent 55%),
  radial-gradient(90% 160% at 100% 0%, var(--night-2) 0%, transparent 60%), var(--night);
  display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.banner::after{display:none;content:"";position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 85% 60%,#fff5 50%,transparent 51%),radial-gradient(1.4px 1.4px at 40% 75%,#fff4 50%,transparent 51%);pointer-events:none}
.banner>*{position:relative;z-index:1}
.b-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.banner .eyebrow{color:#c9c3e8}
.banner h1{font-family:var(--f-logo);font-weight:400;font-size:2.6rem;line-height:1;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,#ff7ac6,#b48af8);-webkit-background-clip:text;background-clip:text;color:transparent}
.status{font-size:.78rem;display:flex;align-items:center;gap:6px;background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;color:#e3def5;max-width:100%}
.dot{width:8px;height:8px;border-radius:50%;background:#9a93c0;flex-shrink:0}
.status[data-s="ok"] .dot{background:#5cd18e} .status[data-s="saving"] .dot{background:var(--gold)} .status[data-s="view"] .dot,.status[data-s="ro"] .dot,.status[data-s="err"] .dot{background:#ff8a7a}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:10px}
.pl{background:#ffffff0a;border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.pl-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl-name{font-weight:700;border:0;background:transparent;padding:0;min-width:0;text-align:left;color:#fff;display:flex;align-items:center;gap:8px}
.pl-name:not(:disabled):hover{text-decoration:underline dotted}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff;flex-shrink:0;background:var(--pc)}
.pl .num{color:#d9d4ef}
.pl .bar{background:#ffffff1c}
.pl input{background:#ffffff1a;border:1px solid #ffffff40;color:#fff;border-radius:6px;padding:3px 7px;width:9rem}
.pl-sync{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:#cfc9ea}
.sync-btn{border:1px solid #ffffff40;background:#ffffff14;color:#fff;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;flex-shrink:0}
.sync-btn:hover{background:#ffffff26}

/* onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--night);border-radius:10px 10px 0 0;padding:0 6px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;padding:11px 12px;font-family:var(--f-display);font-weight:600;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc,var(--pb))}
.tab .avatar{width:20px;height:20px;font-size:.66rem;font-family:var(--f-body)}
.tab .count{font-family:var(--f-body);font-size:.7rem;background:var(--surface);border-radius:999px;padding:0 7px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.search svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:1rem;padding:4px 0;outline:none}
.selects{display:flex;flex-wrap:wrap;gap:8px}
.selects select{flex:1 1 12rem;min-width:0}

/* étapes du carnet */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage-head{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--scs);border-bottom:1px solid var(--line)}
.medal{width:40px;height:40px;flex-shrink:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:#fff;background:var(--sc);border-radius:50%;box-shadow:inset 0 0 0 3px #ffffff40}
.stage-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.stage .eyebrow{color:var(--sc)}
.stage-title{background:transparent;border:0;padding:0;text-align:left;font-family:var(--f-display);font-weight:700;font-size:1.15rem;width:100%;overflow-wrap:anywhere}
.stage-title:not(:disabled):hover{text-decoration:underline dotted}
.stage-meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mini{display:flex;align-items:center;gap:6px}
.mini .bar{width:64px;background:var(--surface)}
.icons{display:flex;gap:2px;flex-shrink:0}
.ib{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:4px 7px;font-size:.85rem;font-weight:600}
.ib:not(:disabled):hover{background:var(--sunk);color:var(--ink)}
.ib:disabled{opacity:.35}
.ib.danger[data-arm="1"]{background:var(--danger);color:#fff}
ul.items{list-style:none;margin:0;padding:0}
li.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
li.item:last-child{border-bottom:0}
.icon{width:44px;height:44px;flex-shrink:0;position:relative;border-radius:9px;overflow:hidden}
.icon img,.icon svg{width:100%;height:100%;display:block}
.icon b{position:absolute;right:0;bottom:0;font-size:.62rem;font-weight:800;color:#fff;background:#000a;border-radius:6px 0 0 0;padding:0 4px;line-height:1.4}
li.item.done .icon{filter:saturate(.25);opacity:.7}
li.item.done .txt{color:var(--muted);text-decoration:line-through}
.body{min-width:0;display:flex;flex-direction:column;gap:5px}
.txt{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
button.txt{border:0;background:transparent;padding:0;text-align:left}
button.txt:hover{text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.tag.ach{background:var(--scs,var(--sunk));color:var(--sc,var(--muted))}
.tag.solo-a{background:var(--pa-soft);color:var(--pa)} .tag.solo-b{background:var(--pb-soft);color:var(--pb)}
a.lnk{font-size:.8rem;font-weight:600;color:var(--sc,var(--pa));text-decoration:none;border-bottom:1px solid currentColor}
.desc{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.note{font-size:.88rem;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:6px;padding:5px 8px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.ck{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:2px 9px 2px 4px;font-size:.78rem;font-weight:700;background:var(--surface);min-height:26px;color:var(--muted)}
.ck .box{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--pc);display:grid;place-items:center;font-size:10px;line-height:1}
.ck[aria-pressed="true"]{background:var(--pcs);border-color:var(--pc);color:var(--pc)}
.ck[aria-pressed="true"] .box{background:var(--pc)}
.ck[aria-pressed="true"] .box::after{content:"✓";color:#fff}
.ck .api{font-size:.62rem;letter-spacing:.06em;opacity:.8}
.ck.sm{min-height:22px;padding:1px 4px;font-size:.7rem}
.ck.sm .box{width:13px;height:13px;font-size:8px}
.prog{display:flex;flex-wrap:wrap;gap:10px}
.prog .mini .bar{width:80px}
.steps-toggle{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;font-size:.82rem;font-weight:600;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
ol.steps li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);align-items:center;font-size:.9rem}
ol.steps li:last-child{border-bottom:0}
ol.steps li .sck{display:flex;gap:4px}
ol.steps li.all{color:var(--muted)}
.kind{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.7;margin-right:6px}

/* formulaires */
.edit-form,.add-form{display:grid;gap:8px;padding:12px 14px;background:var(--sunk)}
.edit-form{grid-column:1/-1;border-radius:8px;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>*{flex:1 1 10rem;min-width:0}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=url],input[type=password],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:.95rem;width:100%;box-sizing:border-box}
.search input[type=search]{border:0;padding:4px 0;background:transparent}
textarea{min-height:3.5rem;resize:vertical}
.btn{border:1px solid var(--sc,var(--accent));background:var(--sc,var(--accent));color:#14101f;border-radius:7px;padding:6px 14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.sugg button{display:flex;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 8px;text-align:left}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--sunk)}
.sugg img,.sugg svg{width:30px;height:30px;border-radius:6px;flex-shrink:0}
.sugg .s-name{font-weight:700;font-size:.9rem}
.sugg .s-cat{font-size:.75rem;color:var(--muted)}
.picked{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.9rem}
.picked img{width:30px;height:30px;border-radius:6px}
.picked .grow{flex:1;min-width:0}
.add-toggle{width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:transparent;padding:10px 14px;color:var(--sc,var(--pc));font-weight:700}
.add-toggle:hover{background:var(--scs,var(--pcs))}
.empty{padding:14px;color:var(--muted);font-size:.9rem}
.new-stage{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:12px;font-family:var(--f-display);font-weight:600;color:var(--muted)}
.new-stage:hover{color:var(--ink);border-color:var(--muted)}

/* espace solo */
.solo-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,var(--pcs),var(--surface) 70%);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:10px;padding:14px 16px}
.solo-head .avatar{width:44px;height:44px;font-size:1.2rem}
.solo-head h2{font-size:1.2rem;color:var(--ink)}
.solo-head .grow{flex:1;min-width:0}
.obj{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:10px;overflow:hidden}
.obj-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 10px}
.obj-check{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:2px solid var(--pc);background:transparent;display:grid;place-items:center;color:#fff;font-weight:800;margin-top:2px}
.obj-check[aria-pressed="true"]{background:var(--pc)}
.obj-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.obj-title{font-family:var(--f-display);font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.obj.done .obj-title{text-decoration:line-through;color:var(--muted)}
.obj-prog{display:flex;align-items:center;gap:8px}
.obj-prog .bar{flex:1;max-width:220px}
.ach-list{border-top:1px solid var(--line)}
.ach-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.ach-row:last-child{border-bottom:0}
.ach-row>img,.ach-row>svg{width:38px;height:38px;border-radius:8px;display:block}
.ach-row .r-open{border:0;background:transparent;padding:0;text-align:left;min-width:0}
.ach-row .r-open:hover .r-name{text-decoration:underline}
.ach-row.is-done>img{filter:saturate(.3);opacity:.75}
.ach-row.is-done .r-name{color:var(--muted)}
.r-name{font-weight:700;overflow-wrap:anywhere}
.r-cat{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.state-pill{font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1.5px solid var(--pc);color:var(--pc);background:transparent}
button.state-pill:not(:disabled):hover{background:var(--pcs)}
.state-pill.done{background:var(--pc);color:#14101f}
.state-pill.none{border-color:var(--line);color:var(--muted)}
.obj-add{padding:10px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}

/* catalogue */
.cat-list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px;text-align:left}
.cat-row:last-child{border-bottom:0}
.cat-row:hover{background:var(--sunk)}
.cat-row>img,.cat-row>svg{width:42px;height:42px;border-radius:8px}
.cat-row .in{color:var(--gold);font-weight:800}
.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums;border:1.5px solid var(--pc);color:var(--pc);white-space:nowrap}
.pill.done{background:var(--pc);color:#14101f}
.pill.none{border-color:var(--line);color:var(--muted)}
.more{width:100%;border:0;border-top:1px solid var(--line);background:var(--sunk);padding:10px;font-weight:700;color:var(--ink)}

/* fiche succès (style jeu) */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 20px) 12px 24px;overflow-y:auto;z-index:10}
.gcard{width:100%;max-width:48rem;background:var(--g-bg);color:var(--g-ink);border-radius:10px;border:1px solid var(--g-line);box-shadow:0 24px 70px #000a;overflow:hidden;box-sizing:border-box}
.who{display:flex;align-items:stretch;background:var(--night);border-bottom:1px solid var(--g-line)}
.who-lbl{display:flex;align-items:center;padding:0 14px;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--g-muted);font-weight:700}
.who-tab{flex:1;border:0;background:transparent;color:var(--g-muted);padding:12px 10px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:1rem;border-bottom:4px solid transparent}
.who-tab .avatar{opacity:.5}
.who-tab:hover{color:var(--g-ink);background:#ffffff08}
.who-tab[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--pc) 30%,transparent));border-bottom-color:var(--pc)}
.who-tab[aria-selected="true"] .avatar{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 45%,transparent)}
.who-close{border:0;background:transparent;color:var(--g-muted);font-size:1.1rem;padding:0 16px}
.who-close:hover{color:#fff}
.g-body{display:grid;grid-template-columns:170px 1fr}
.g-side{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 14px;border-right:1px solid var(--g-line);background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 24%,var(--g-panel)) 0%,var(--g-panel) 45%)}
.g-icon{width:84px;height:84px;border-radius:50%;padding:4px;background:radial-gradient(circle at 30% 30%,#ffe8a8,#b8862a);box-shadow:0 4px 14px #0008;box-sizing:border-box}
.g-icon img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover}
.g-sep{width:100%;display:flex;align-items:center;gap:8px;color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.g-sep::before,.g-sep::after{content:"";flex:1;height:1px;background:var(--g-line)}
.g-pts{text-align:center}
.g-pts .big{font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.g-pts .of{color:var(--g-muted);font-size:1rem}
.g-pts .lbl{font-size:.8rem;color:var(--g-muted);font-weight:600}
.rewards{display:flex;flex-direction:column;gap:8px;width:100%}

  /* ---------- clé API et synchro automatique ---------- */
  var syncing = false, syncErr = '';
  function getKey(){ try{ return me ? localStorage.getItem('gw2-key-'+me) : null; }catch(e){ return null; } }
  function setKey(k){ try{ if(k) localStorage.setItem('gw2-key-'+me, k); else localStorage.removeItem('gw2-key-'+me); }catch(e){} }
  function compact(data){ var d = {}, n = 0; data.forEach(function(x){ if(x && x.id!=null){ d[x.id] = [x.current||0, x.max||0, x.done?1:0, x.bits||[]]; if(x.done) n++; } }); return {d:d, n:n}; }
  function syncGame(force){
    var k = getKey(); if(!k || !me || syncing || status==='login') return Promise.resolve();
    syncing = true; if(force) render();
    return fetch('https://api.guildwars2.com/v2/account/achievements?access_token='+encodeURIComponent(k))
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      syncing = false;
      if(!res.ok || !Array.isArray(res.j)){ syncErr = 'Clé refusée par le jeu : '+((res.j&&res.j.text)||'erreur'); render(); return; }
      syncErr = '';
      var c = compact(res.j), old = prog[me] && prog[me].d;
      var same = old && JSON.stringify(old)===JSON.stringify(c.d);
      var stale = !prog[me] || (Date.now() - new Date(prog[me].at).getTime() > 3600e3);
      prog[me] = {at:new Date().toISOString(), n:c.n, d:c.d};
      if(!same || stale || force) queue('progress-'+me, prog[me]);
      render();
    }).catch(function(){ syncing = false; syncErr = 'Impossible de joindre l’API du jeu'; render(); });
  }
  setInterval(function(){ if(document.visibilityState==='visible') syncGame(false); }, 5*60*1000);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible' && prog[me] && Date.now()-new Date(prog[me].at).getTime() > 4*60*1000) syncGame(false); });

  function openImport(p){ ui.importFor=p; renderSheet(); }
